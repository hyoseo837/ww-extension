<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WW Extension Settings</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 24px 40px; color: #222; }
      h1 { font-size: 20px; margin-bottom: 20px; color: #1a73e8; }
      label { display: block; font-size: 13px; font-weight: 600; margin-top: 16px; }
      input, select, textarea {
        width: 100%; margin-top: 4px;
        padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;
      }
      textarea { height: 200px; resize: vertical; font-family: monospace; font-size: 12px; }
      .row { display: flex; gap: 8px; margin-top: 20px; }
      button { flex: 1; padding: 9px; font-size: 13px; cursor: pointer; border: 1px solid #aaa; border-radius: 4px; background: #f5f5f5; }
      button:hover { background: #e8e8e8; }
      #status { margin-top: 10px; font-size: 12px; min-height: 16px; color: #555; }
      #status.ok { color: green; }
      #status.err { color: red; }
      /* Tab nav */
      #tabs { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 4px; }
      .tab { padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: none; color: #666; border-bottom: 3px solid transparent; margin-bottom: -2px; flex: none; }
      .tab:hover { color: #1a73e8; }
      .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
      .tab-panel { display: none; }
      .tab-panel.active { display: block; }
      /* Context tab */
      .pdf-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .pdf-row input[type="file"] { flex: 1; padding: 5px; font-size: 12px; }
      .pdf-row button { flex: none; width: auto; padding: 7px 14px; font-size: 13px; }
      #extractStatus { font-size: 12px; min-height: 16px; color: #555; margin-top: 4px; }
      #extractStatus.ok { color: green; }
      #extractStatus.err { color: red; }
      #extractedText { background: #f8f8f8; color: #444; cursor: default; }
    </style>
  </head>
  <body>
    <h1>WW Extension Settings</h1>

    <div id="tabs">
      <button class="tab active" data-tab="api">API</button>
      <button class="tab" data-tab="context">Context</button>
      <button class="tab" data-tab="prefs">Preferences</button>
    </div>

    <div id="tab-api" class="tab-panel active">
      <label>API Key
        <input id="apiKey" type="password" placeholder="AIza..." />
      </label>
      <label>Model
        <select id="model">
          <option value="gemini-2.5-flash">gemini-2.5-flash (default)</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        </select>
      </label>
      <div class="row">
        <button id="test">Test API Key</button>
      </div>
    </div>

    <div id="tab-context" class="tab-panel">
      <label>Application Package PDF</label>
      <div class="pdf-row">
        <input id="packageFile" type="file" accept=".pdf" />
        <button id="extract">Extract from PDF</button>
      </div>
      <div id="extractStatus"></div>
      <small>Your PDF is sent to Google's Gemini API for text extraction.</small>
      <label>Extracted Text
        <textarea id="extractedText" readonly placeholder="Extracted text will appear here..."></textarea>
      </label>
      <label>Profile
        <textarea id="cvText" placeholder="Paste your CV / resume summary here..."></textarea>
      </label>
    </div>

    <div id="tab-prefs" class="tab-panel">
      <label>Preferences
        <textarea id="preferences" placeholder="e.g. Prefer Waterloo or Toronto, no San Francisco. Open to backend or data roles, not interested in QA."></textarea>
      </label>
      <small>Included in each scoring prompt as a separate section. Leave blank to omit entirely (no token cost).</small>
    </div>

    <div class="row">
      <button id="save">Save</button>
    </div>
    <div id="status"></div>
    <script src="src/options.js"></script>
  </body>
</html>
