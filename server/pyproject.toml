[project]
name = "ww-extension-backend"
version = "8.14.3"
description = "Backend for ww-extension Chrome extension"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "asyncpg>=0.30",
    "httpx[http2]>=0.27",
    "stripe>=11",
    "sentry-sdk[fastapi]>=2.62.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
