[project]
name = "ww-extension-backend"
version = "5.1.2"
description = "Backend for ww-extension Chrome extension"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "asyncpg>=0.30",
    "httpx[http2]>=0.27",
    "stripe>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
