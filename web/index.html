<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WW Scorer — AI scoring for WaterlooWorks co-op jobs</title>
    <meta
      name="description"
      content="Score your WaterlooWorks co-op postings with AI. Upload your resume, set your criteria, and rank every job by fit — pay only for what you scan."
    />
    <meta name="theme-color" content="#8F4830" />

    <!-- Favicon. Replace the placeholder/owner-supplied assets in web/public/:
         favicon.svg (primary), favicon.ico (fallback), apple-touch-icon.png 180×180. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Twitter — link previews when the URL is shared.
         og-image.png (1200×630) goes in web/public/. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WW Scorer" />
    <meta property="og:title" content="WW Scorer — AI scoring for WaterlooWorks co-op jobs" />
    <meta
      property="og:description"
      content="Upload your resume, set your criteria, and let AI rank every WaterlooWorks co-op posting by fit. Pay only for what you scan."
    />
    <meta property="og:url" content="https://ww-extension.hyoseo.dev/" />
    <meta property="og:image" content="https://ww-extension.hyoseo.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WW Scorer — AI scoring for WaterlooWorks co-op jobs" />
    <meta
      name="twitter:description"
      content="Upload your resume, set your criteria, and let AI rank every WaterlooWorks co-op posting by fit. Pay only for what you scan."
    />
    <meta name="twitter:image" content="https://ww-extension.hyoseo.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
